name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "tests/**"
      - "eng/**"
      - "Hvp.slnx"
      - "global.json"
      - "Directory.*"

permissions:
  contents: read

jobs:
  build-test-publish:
    name: Windows build, test, publish
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore .\Hvp.slnx --locked-mode

      - name: Build
        run: dotnet build .\Hvp.slnx -c Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          Get-ChildItem .\tests -Recurse -Filter *.csproj | ForEach-Object {
            $resultName = "$($_.BaseName).trx"
            dotnet test $_.FullName -c Release --no-build --logger "trx;LogFileName=$resultName" --results-directory .\artifacts\test-results
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Publish single-file x64 app
        run: dotnet publish .\src\Hvp.App\Hvp.App.csproj -c Release -r win-x64 --self-contained true --no-restore -o .\artifacts\publish\win-x64

      - name: Verify single-file publish structure
        shell: pwsh
        run: |
          $entries = @(Get-ChildItem .\artifacts\publish\win-x64 -Recurse -Force)
          $files = @($entries | Where-Object { -not $_.PSIsContainer })
          $executables = @($files | Where-Object Extension -EQ ".exe")
          if ($entries.Count -ne 1 -or $files.Count -ne 1 -or $executables.Count -ne 1 -or $executables[0].Name -cne "HVP-win-x64.exe") {
            $names = $entries.FullName -join ", "
            throw "Expected only HVP-win-x64.exe and no loose companion files; found: $names"
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: warn

      - name: Upload smoke-test candidate
        uses: actions/upload-artifact@v7
        with:
          name: HVP-win-x64-ci
          path: artifacts/publish/win-x64
          if-no-files-found: error
