name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "tests/**"
      - "eng/**"
      - "Hvp.slnx"
      - "global.json"
      - "Directory.*"

permissions:
  contents: read

jobs:
  build-test-publish:
    name: Windows build, test, publish
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore .\Hvp.slnx --locked-mode

      - name: Build
        run: dotnet build .\Hvp.slnx -c Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          Get-ChildItem .\tests -Recurse -Filter *.csproj | ForEach-Object {
            $resultName = "$($_.BaseName).trx"
            dotnet test $_.FullName -c Release --no-build --logger "trx;LogFileName=$resultName" --results-directory .\artifacts\test-results
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Publish self-contained x64 application payload
        run: dotnet publish .\src\Hvp.App\Hvp.App.csproj -c Release -r win-x64 --self-contained true --no-restore -o .\artifacts\publish\win-x64

      - name: Generate and validate application-payload manifest
        shell: pwsh
        run: |
          .\eng\release\Test-ManagedPayloadContract.ps1 -PayloadRoot .\artifacts\publish\win-x64
          .\eng\release\New-ApplicationPayloadManifest.ps1 -PayloadRoot .\artifacts\publish\win-x64 -ManifestPath .\artifacts\payload-manifest.json
          .\eng\release\Test-ApplicationPayloadManifest.ps1 -PayloadRoot .\artifacts\publish\win-x64 -ManifestPath .\artifacts\payload-manifest.json

      - name: Test payload validation scripts
        shell: pwsh
        run: .\eng\release\tests\Test-ApplicationPayloadManifest.Tests.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: warn

      - name: Upload smoke-test candidate
        uses: actions/upload-artifact@v7
        with:
          name: HVP-win-x64-ci
          path: |
            artifacts/publish/win-x64
            artifacts/payload-manifest.json
          include-hidden-files: true
          if-no-files-found: error
