name: CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "eng/**"
      - "Hvp.slnx"
      - "global.json"
      - "Directory.*"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "eng/**"
      - "Hvp.slnx"
      - "global.json"
      - "Directory.*"

permissions:
  contents: read

jobs:
  build-test-publish:
    name: Windows build, test, publish
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore .\Hvp.slnx --locked-mode

      - name: Build
        run: dotnet build .\Hvp.slnx -c Release --no-restore

      - name: Test
        run: dotnet test .\Hvp.slnx -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory .\artifacts\test-results

      - name: Publish single-file x64 app
        run: dotnet publish .\src\Hvp.App\Hvp.App.csproj -c Release -r win-x64 --self-contained true --no-restore -o .\artifacts\publish\win-x64

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: warn

      - name: Upload smoke-test candidate
        uses: actions/upload-artifact@v7
        with:
          name: HVP-win-x64-ci
          path: artifacts/publish/win-x64
          if-no-files-found: error
