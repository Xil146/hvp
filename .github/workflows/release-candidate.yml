name: Release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  candidate:
    name: Build release candidate
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore, build, and test
        shell: pwsh
        run: |
          dotnet restore .\Hvp.slnx --locked-mode
          dotnet build .\Hvp.slnx -c Release --no-restore
          dotnet test .\Hvp.slnx -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory .\artifacts\test-results

      - name: Publish candidate
        run: dotnet publish .\src\Hvp.App\Hvp.App.csproj -c Release -r win-x64 --self-contained true --no-restore -o .\artifacts\release

      - name: Hash candidate
        shell: pwsh
        run: Get-FileHash .\artifacts\release\*.exe -Algorithm SHA256 | Format-List | Out-File .\artifacts\release\SHA256SUMS.txt -Encoding utf8

      - name: Upload candidate for hardware and clean-machine testing
        uses: actions/upload-artifact@v7
        with:
          name: HVP-release-candidate
          path: |
            artifacts/release
            artifacts/test-results
          if-no-files-found: error
